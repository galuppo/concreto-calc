<mat-toolbar>
	<button matIconButton (click)="drawer.toggle()"><mat-icon>menu</mat-icon></button>
	<span>Concreto CALC</span>
</mat-toolbar>
<mat-drawer-container autosize>
	<mat-drawer #drawer mode="side" opened="true">
		<div class="list-group list-group-flush">
			<div class="list-group-item list-group-item-action" (click)="toggle('calice')">
				<span class="h3">Cálice</span>
				<div class="list-group list-group-flush" *ngIf="visible('calice')">
					<div class="list-group-item list-group-item-action w-100" (click)="redirect('calice/detalhamento'); drawer.toggle()">Detalhamento</div>
					<!-- <div class="list-group-item list-group-item-action" (click)="$event.stopPropagation()" disabled>Dimensionamento</div> -->
				</div>
			</div>

		</div>
	</mat-drawer>
	<div class="w-100" style="min-height: 600px">
		<router-outlet></router-outlet>
	</div>
</mat-drawer-container>
