<div class="w-100" style="min-height: 600px; min-width: 375px;">
	<mat-accordion class="mt-2">
		<mat-expansion-panel>
			<mat-expansion-panel-header>
				<mat-panel-title>
					Cálices Salvos
				</mat-panel-title>				
			</mat-expansion-panel-header>
			<calice-list></calice-list>
		</mat-expansion-panel>
	</mat-accordion>
	<mat-card appearance="outlined">
		<mat-card-content>
			<mat-card class="d-flex float-start m-2">
				<mat-card-header>
					<mat-card-title>Dados Cálice</mat-card-title>
				</mat-card-header>
				<mat-card-content>
					<form>
						<div class="input-group mt-3">
							<span class="input-group-text">Identificador</span>
							<input name="nome" type="text" class="form-control" [(ngModel)]="model.nome">
						</div>
						<div class="input-group">
							<span class="input-group-text">Quantidade</span>
							<input name="quantidae" type="number" step="1" min="1" class="form-control"
								[(ngModel)]="multiplo">
						</div>
						<div class="mt-3 rounded border p-1">
							<label class="form-label h5" for="secaoPilar">Pilar</label>
							<div class="input-group" id="secaoPilar">
								<span class="input-group-text">Largura:</span>
								<input name="pilarX" type="number" class="form-control" [(ngModel)]="model.pilarX">
								<span class="input-group-text">cm</span>
								<span class="input-group-text ms-3">Altura:</span>
								<input name="pilarY" type="number" class="form-control" [(ngModel)]="model.pilarY">
								<span class="input-group-text">cm</span>
							</div>
						</div>
						<div class="mt-3 rounded border p-1">
							<label for="secaoColarinho" class="form-label h5">Cálice</label>
							<div id="secaoColarinho">
								<div class="input-group">
									<span class="input-group-text">Espessura Colarinho</span>
									<input type="number" name="espCol" [(ngModel)]="model.espessuraColarinho"
										class="form-control" step=".5" min="15">
									<span class="input-group-text">cm</span>
								</div>
								<div class="input-group">
									<span class="input-group-text">Espessura Junta</span>
									<input type="number" name="espJun" [(ngModel)]="model.espessuraJunta"
										class="form-control" step=".5" min="7.5">
									<span class="input-group-text">cm</span>
								</div>
								<div class="input-group">
									<span class="input-group-text">Embutimento</span>
									<input type="number" name="emb" [(ngModel)]="model.embutimento" class="form-control"
										step="5" min="40">
									<span class="input-group-text">cm</span>
								</div>
							</div>
						</div>
						<!-- <div class="input-group mt-3">
							<span class="input-group-text">Concreto: </span>
							<select name="concreto" class="form-select" [(ngModel)]="model.concreto">
								@for(classe of classesConcreto; track classe.fckMPa){
								<option [ngValue]="classe">C{{classe.fckMPa}}</option>
								}
							</select>
						</div> -->
						<div class="mt-3 rounded border p-1">
							<label for="armHorzPrincipal" class="form-label h5">Armadura Horizontal
								Principal</label>
							<div class="input-group" id="armHorzPrincipal">
								<span class="input-group-text">Ø</span>
								<select name="armHorzPrincipal" [(ngModel)]="model.armHorzPrincipal!.barra">
									@for(barra of barrasAco; track barra){
									<option [ngValue]="barra">{{barra.dmm | number: "1.1-1"}}</option>
									}
								</select>
								<span class="input-group-text ms-3">Quantidade:</span>
								<input name="qtdeHorzPrincipal" type="number" class="form-control"
									[(ngModel)]="model.armHorzPrincipal!.quantidade" min="1">
								<span class="input-group-text ms-3">As:</span>
								<input type="number" class="form-control"
									[value]="calculaAsEfetivo(model.armHorzPrincipal!)*2" disabled>
								<span class="input-group-text">cm²</span>
							</div>
						</div>
						<div class="mt-1 rounded border p-1">
							<label for="armHorzSec" class="form-label h5">Armadura Horizontal Secundária</label>
							<div class="input-group" id="armHorzSec">
								<span class="input-group-text">Ø</span>
								<select name="armHorzSec" [(ngModel)]="model.armHorzSecundaria!.barra">
									@for(barra of barrasAco; track barra){
									<option [ngValue]="barra">{{barra.dmm | number: "1.1-1"}}</option>
									}
								</select>
								<span class="input-group-text ms-3">Quantidade:</span>
								<input name="qtdeHorzSec" type="number" class="form-control"
									[(ngModel)]="model.armHorzSecundaria!.quantidade" min="1">
								<span class="input-group-text ms-3">As:</span>
								<input type="number" class="form-control"
									[value]="calculaAsEfetivo(model.armHorzSecundaria!)*2" disabled>
								<span class="input-group-text">cm²</span>
							</div>
						</div>
						<div class="mt-1 rounded border p-1">
							<label for="armVertPrinc" class="form-label h5">Armadura Vertical Principal</label>
							<div class="input-group" id="armVertPrinc">
								<span class="input-group-text">Ø</span>
								<select name="armVertPrinc" [(ngModel)]="model.armVertPrincipal!.barra">
									@for(barra of barrasAco; track barra){
									<option [ngValue]="barra">{{barra.dmm | number: "1.1-1"}}</option>
									}
								</select>
								<span class="input-group-text ms-3">Quantidade:</span>
								<input name="qtdeVertPrinc" type="number" class="form-control"
									[(ngModel)]="model.armVertPrincipal!.quantidade" min="1">
								<span class="input-group-text ms-3">As:</span>
								<input type="number" class="form-control"
									[value]="calculaAsEfetivo(model.armVertPrincipal!)*2" disabled>
								<span class="input-group-text">cm²</span>
							</div>
						</div>
						<div class="mt-1 rounded border p-1">
							<label for="armVertSec" class="form-label h5">Armadura Vertical Secundária</label>
							<div class="input-group" id="armVertSec">
								<span class="input-group-text">Ø</span>
								<select name="armVertSec" [(ngModel)]="model.armVertSecundaria!.barra">
									@for(barra of barrasAco; track barra){
									<option [ngValue]="barra">{{barra.dmm | number: "1.1-1"}}</option>
									}
								</select>
								<span class="input-group-text ms-3">Quantidade:</span>
								<input name="qtdeVertSec" type="number" class="form-control"
									[(ngModel)]="model.armVertSecundaria!.quantidade" min="1">
								<span class="input-group-text ms-3">As:</span>
								<input type="number" class="form-control"
									[value]="calculaAsEfetivo(model.armVertSecundaria!)*2" disabled>
								<span class="input-group-text">cm²</span>
							</div>
						</div>
					</form>
				</mat-card-content>
				<mat-card-actions>
					<button mat-flat-button (click)="previsualizar()">Pré-visualizar</button>
					<a mat-flat-button (click)="download()">Download</a>
					<button mat-flat-button (click)="quantitativo()">Gerar Quantitativo</button>
					<button mat-flat-button (click)="salvar()">Salvar</button>
					<a #downloadLink style="display: none;"></a>
				</mat-card-actions>
			</mat-card>
			<quantitativo class="d-flex m-2 float-start" [volConcreto]="volConcreto" [areaForma]="areaForma"
				[armaduras]="quantitativoArmadura"></quantitativo>
		</mat-card-content>
	</mat-card>

</div>
