<div class="w-100" style="min-height: 600px; min-width: 375px;">
	<mat-card appearance="outlined">
		<mat-card-content>
			<mat-card class="d-flex float-start m-2">
				<mat-card-header>
					<mat-card-title>Dados Cálice</mat-card-title>
				</mat-card-header>
				<mat-card-content>
					<form>
						<!-- Identificador -->
						<div class="input-group mt-3">
							<span class="input-group-text">Identificador</span>
							<input name="nome" type="text" class="form-control" [(ngModel)]="caliceDimParams.nome">
						</div>
						<!-- Seção pilar -->
						<div class="mt-3 rounded border p-1">
							<label for="secaoPilar" class="form-label h5">Pilar</label>
							<div class="input-group" id="secaoPilar">
								<span class="input-group-text">Largura:</span>
								<input type="number" name="pilarX" class="form-control"
									[(ngModel)]="caliceDimParams.pilarX">
								<span class="input-group-text">cm</span>
								<span class="input-group-text ms-3">Altura:</span>
								<input type="number" name="pilarY" class="form-control"
									[(ngModel)]="caliceDimParams.pilarY">
								<span class="input-group-text">cm</span>
							</div>
						</div>
						<!-- Seção colarinho -->
						<div class="mt-3 rounded border p-1">
							<label for="secaoColarinho" class="form-label h5">Cálice</label>
							<div id="secaoColarinho">
								<!-- Espessura -->
								<div class="input-group">
									<span class="input-group-text">Espessura Colarinho</span>
									<input type="number" name="espessuraColarinho"
										[(ngModel)]="caliceDimParams.espColarinho" class="form-control" step=".5"
										min="15">
									<span class="input-group-text">cm</span>
								</div>
								<!-- Junta -->
								<div class="input-group">
									<span class="input-group-text">Espessura Junta</span>
									<input type="number" name="espessuraJunta" [(ngModel)]="caliceDimParams.espJunta"
										class="form-control" step=".5" min="7.5">
									<span class="input-group-text">cm</span>
								</div>
								<!-- Embutimento -->
								<div class="input-group">
									<span class="input-group-text">Embutimento</span>
									<input type="number" name="embutimento"
										[(ngModel)]="caliceDimParams.compEmbutimento" class="form-control" step="5"
										min="40">
									<span class="input-group-text">cm</span>
								</div>
							</div>
						</div>
						<!-- Classe de concreto -->
						<div class="mt-3 rounded border p-1">
							<div class="input-group">
								<span class="input-group-text">Concreto:</span>
								<select name="concreto" class="form-select" [(ngModel)]="caliceDimParams.concreto">
									@for(concreto of classesConcreto; track concreto){
									<option [ngValue]="concreto">{{concreto.fckMPa}} MPa</option>
									}
								</select>
							</div>

						</div>
					</form>
				</mat-card-content>
			</mat-card>
		</mat-card-content>

	</mat-card>
</div>
