<div class="w-100" style="min-height: 600px; min-width: 375px;">
	<mat-card appearance="outlined">
		<mat-card-content>
			<mat-card class="d-flex float-start m-2">
				<mat-card-header>
					<mat-card-title>Dados Estaca</mat-card-title>
				</mat-card-header>
				<mat-card-content>
					<form>
						<div class="input-group mt-3">
							<span class="input-group-text">Identificador</span>
							<input name="nome" type="text" class="form-control" [(ngModel)]="model.nome">
							<span class="input-group-text ms-3">Quantidade</span>
							<input name="qtde" type="number" class="form-control" min="1" [(ngModel)]="quantidade">
							<span class="input-group-text ms-3">Escala</span>
							<span class="input-group-text">1:</span>
							<input name="escala" type="number" class="form-control" min="1" [(ngModel)]="escala">
						</div>
						<div class="mt-3 rounded border p-1">
							<label class="form-label h5" for="estaca">Estaca</label>
							<div class="input-group" id="estaca">
								<span class="input-group-text">Diâmetro</span>
								<input name="diam" type="number" class="form-control" [(ngModel)]="model.diametro">
								<span class="input-group-text">cm</span>
								<span class="input-group-text ms-3">Profundidade</span>
								<input name="prof" type="number" class="form-control" [(ngModel)]="model.comprimento" step="50">
								<span class="input-group-text">cm</span>
							</div>
						</div>
						<div class="mt-3 rounded border p-1">
							<label for="armadura" class="form-label h5">Armadura</label>
							<div id="armadura">
								<label for="armLong" class="form-label fw-medium">Longitudinal</label>
								<div class="input-group" id="armLong">
									<span class="input-group-text">Ø</span>
									<select name="armLong" [(ngModel)]="model.armLong!.barra">
										@for(barra of barrasAco; track barra){
										<option [ngValue]="barra">{{barra.dmm | number: "1.1-1"}}</option>
										}
									</select>
									<span class="input-group-text ms-3">Quantidade:</span>
									<input name="qtdeArmLong" type="number" class="form-control" min="1" [(ngModel)]="model.armLong!.quantidade">
									<span class="input-group-text ms-3">Comprimento:</span>
									<input name="compArmLong" type="number" class="form-control" min="1" [(ngModel)]="compArmLong">
									<span class="input-group-text">cm</span>
									<span class="input-group-text ms-3">As:</span>
									<input type="text" class="form-control" [value]="calculaAsEfetivo(model.armLong!)" disabled>
									<span class="input-group-text">cm²</span>
								</div>
								<label for="armEst" class="form-label fw-medium">Estribo</label>
								<div class="input-group" id="armEst">
									<span class="input-group-text">Ø</span>
									<select name="armEst" [(ngModel)]="model.armEstribo!.barra">
										@for(barra of barrasAco; track barra){
										<option [ngValue]="barra">{{barra.dmm | number: "1.1-1"}}</option>
										}
									</select>
									<span class="input-group-text ms-3">Espaçamento:</span>
									<input name="espArmEst" type="number" class="form-control" min="1" [(ngModel)]="model.armEstribo!.espacamento">
									<span class="input-group-text">cm</span>
									<span class="input-group-text ms-3">As:</span>
									<input type="text" class="form-control" [value]="calculaAsEfetivo(model.armEstribo!)*2*(100/(model.armEstribo!.espacamento!)) | number: '1.3-3'" disabled>
									<span class="input-group-text">cm²/m</span>
								</div>
							</div>
						</div>
					</form>
				</mat-card-content>
				<mat-card-actions>
					<button mat-flat-button (click)="previsualizar()">Pré-visualizar</button>
					<a mat-flat-button (click)="download()">Download</a>
					<button mat-flat-button (click)="quantitativo()">Gerar Quantitativo</button>
					<a #downloadLink style="display: none;"></a>
				</mat-card-actions>
			</mat-card>
			<quantitativo class="d-flex m-2 float-start"></quantitativo>
		</mat-card-content>

	</mat-card>
</div>
